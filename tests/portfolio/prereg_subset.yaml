# 부록 1(configs/prereg.yaml) 중 B 코드가 읽는 절을 그대로 옮긴 테스트 입력.
# configs/prereg.yaml이 커밋되면 test_params.py가 두 파일이 같은지 확인한다.
calendar:
  timezone: "Asia/Seoul"
  signal_day: "last_trading_day_of_week"
  signal_cutoff_time: "15:30"
  execution: "next_trading_day_close"
  annualization: {daily: 252, weekly: 52}

data:
  start_date: "2010-01-04"
  first_train_signal_year: 2011
  price_column: "close"            # KRX 정규장 수정종가
  raw_price_column: "close_raw"    # 동전주 판정 전용
  investor_flow_lag_days: 1

costs:
  sell_tax: 0.0020
  commission_per_side: 0.00015
  slippage_per_side: 0.0010
  stress_multiplier: 2.0
  cash_return: 0.0

splits:
  walk_forward_test_years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  validation_years: 2
  purge: "drop_signal_dates_whose_label_window_reaches_next_segment"
  holdout_signal_range: ["2026-01-01", "2026-10-31"]
  holdout_open_date: "2026-12-11"
  forward_test:
    baseline_signals_from: "2026-11-06"
    positions_from: "2026-11-20"
    ml_signals_from: "2026-11-27"

portfolio:
  buffer_rule:
    enter_rank_max: 20
    exit_rank_greater_than: 40
    max_holdings: 20
    weighting: "equal"
  rl:
    library: "stable-baselines3"
    algorithm: "PPO"
    policy: "MlpPolicy"
    candidate_top_k: 40
    max_holdings: 20
    min_weight: 0.005
    slots: 60
    episode_steps: 52
    total_timesteps_per_seed: 300000
    lambda_search: {grid: [0, 0.5, 1, 2], seed: 0, total_timesteps: 100000}
    eval_every_steps: 10000
    checkpoint_selection: "val_ir"
    seeds: [0, 1, 2, 3, 4]
    test_action: "deterministic_mean"
    other_hyperparameters: "sb3_defaults"
    env:                                   # DEC-21 (design_B.md 8절 D3)
      action_bound: 10.0                   # (a) 행동 = 로짓, 범위 [−10, 10]
      out_of_universe_fill: 0.0            # (b) U_t 밖 보유 슬롯의 rank_score 백분위·crash_prob·vol_20
      candidate_overflow: "drop_nonheld_worst_rank"   # (c)
      top_k_tie_break: "better_rank_first"            # (d)
      episode_end: "truncated"                        # (e)
      lambda_score: "max_checkpoint_val_ir_then_smaller_lambda"  # (f)
      signal_dates: "purged_h20_no_step_over_gaps"    # (g)
      current_weight: "signal_date_close"             # (h)

risk_layer:
  stock_cap: 0.10
  sector_cap: 0.30
  sector_source: "KRX_industry"     # 시점별 이력이 없으면 Q-04 결정에 따름
  unknown_sector_label: "미분류"
  excess_weight_to: "cash"
  vol_lookback_days: 20
  vol_target_annual: "FILL_B_BY_2026-11-08"   # 2011~2015 매 거래일 sigma의 산술평균 (6.9절, Q-12)
  exposure_min: 0.30
  exposure_max: 1.00
  momentum_crash_regime:
    drawdown_threshold: 0.20
    drawdown_high_lookback_days: 252
    drawdown_recent_window_days: 60
    rebound_lookback_days: 20
    rebound_threshold: 0.10
    exposure_cap: 0.70
  invariant_tolerance: 1.0e-9
